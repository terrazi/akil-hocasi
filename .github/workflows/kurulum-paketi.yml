name: Kurulum paketi

# main dalına her gönderimde ve "v0.1.0" gibi etiketlerde Windows kurulum dosyası üretir.
# GitHub'da bir sürüm (Release) yayımlanınca kurulum dosyası o sürüme eklenir.
# Actions sekmesinden elle de çalıştırılabilir.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Öz testte gerçek llama-server ile uçtan uca sınama için küçük modeller (Qwen3.5 0.8B + Qwen3 Embedding 0.6B)
      - name: Test modelleri önbelleği
        uses: actions/cache@v4
        with:
          path: derleme/modeller
          key: test-modelleri-${{ hashFiles('akil_hocasi/yz/katalog.py', 'paketleme/test_modelleri.py') }}

      - name: Kurulum paketini oluştur (test → llama-server → PyInstaller → öz test → Inno Setup)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./paketleme/paket_olustur.ps1

      - name: Öz test raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oz-test-raporu
          path: derleme/oz_test_raporu.txt
          if-no-files-found: ignore

      - name: Kurulum dosyası
        uses: actions/upload-artifact@v4
        with:
          name: AkilHocasi-Kurulum
          path: derleme/cikti/*.exe
          retention-days: 30

      - name: Sürüm yayımla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: derleme/cikti/*.exe
